name: Bug report
description: 回報可重現的 EKdelta 問題
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 請勿上傳私人論文、Token、密碼或未匿名化的本機路徑。
  - type: input
    id: browser
    attributes:
      label: Browser / OS
      placeholder: Chrome 140 / macOS 15
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 重現步驟
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 預期結果
  - type: textarea
    id: actual
    attributes:
      label: 實際結果
    validations:
      required: true
