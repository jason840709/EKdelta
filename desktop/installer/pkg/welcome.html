<h1>安裝 EKdelta Desktop</h1>
<p>這個安裝程式會把 <strong>EKdelta Desktop</strong> 放進 Mac 的「應用程式」資料夾。</p>
<p>EKdelta 是供研究寫作使用的 Markdown／論文編輯器。一般 Markdown、表格與 MathLive 公式輸入在安裝完成後即可使用，不需要先學 LaTeX，也不需要安裝 Node.js。</p>
